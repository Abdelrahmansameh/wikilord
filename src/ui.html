<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WikiMasters Bot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6eb;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a5; --line: #262c35; --accent: #5b8def; --chip: #212833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  .badge { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--chip); }
  .badge.live { background: var(--ok); color: #fff; } .badge.dry { background: var(--warn); color: #fff; } .badge.paused { background: var(--bad); color: #fff; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
  nav button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 90px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); padding: 6px 0; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
  pre#log { margin: 0; max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .rule { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
  .rule.off { opacity: .55; }
  .rule-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rule-head input[type=text] { flex: 1; min-width: 140px; }
  .conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin-top: 10px; }
  label.f { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  input[type=text], input[type=number], select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); width: 100%; }
  .rar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 30px; }
  .rar label { display: flex; align-items: center; gap: 3px; color: var(--text); font-size: 13px; }
  .actionrow { display: flex; gap: 10px; align-items: end; margin-top: 10px; flex-wrap: wrap; }
  .actionrow label.f { width: 140px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: minmax(200px, 1fr) 260px; gap: 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row small { display: block; color: var(--muted); }
  .range { display: flex; gap: 6px; }
  #savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: none; gap: 12px; align-items: center; }
  #savebar.show { display: flex; }
  #savemsg { flex: 1; } .err { color: var(--bad); } .good { color: var(--ok); }
  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--bad); color: #fff; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  textarea { width: 100%; font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  ol.steps { padding-left: 20px; margin: 0 0 14px; } ol.steps li { margin-bottom: 8px; }
  code.cmd { background: var(--chip); padding: 2px 8px; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; }
  .scanrow { display: flex; gap: 10px 24px; flex-wrap: wrap; margin-bottom: 14px; }
  .scanitem { display: flex; gap: 8px; align-items: center; }
  .scanitem span { font-size: 12px; margin: 0; }
  td.actions { white-space: nowrap; }
  td.actions > * { margin-right: 6px; }
  td.actions button { padding: 4px 10px; }
  #valuebox td { white-space: nowrap; vertical-align: middle; height: 38px; }
  #valuebox td.btn { padding-left: 0; padding-right: 6px; }
  #valuebox td.btn:first-child { padding-left: 8px; }
  #valuebox td.btn button { width: 100%; padding: 4px 10px; }
  #valuebox td.name { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  #valuebox td.why { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>WikiMasters Bot</h1>
  <span id="mode" class="badge">…</span>
  <button id="pause">Pause</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="savebar"><span id="savemsg"></span><button id="discard">Discard</button><button id="save" class="primary">Save changes</button></div>

<script>
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'x-bot-ui': '1', 'content-type': 'application/json' } }).then(async (r) => ({ ok: r.ok, data: await r.json().catch(() => ({})) }));

const RARITIES = ['C', 'PC', 'R', 'SR', 'UR', 'L'];
const RARITY_NAMES = { C: 'Commune', PC: 'Peu commune', R: 'Rare', SR: 'Super rare', UR: 'Ultra rare', L: 'Légendaire' };
const TRI = [['wishlist', 'On my wishlist'], ['shiny', 'Shiny'], ['starred', 'Starred'], ['tagged', 'Has a tag']];
const NUMS = [['minPageviews', 'Min pageviews'], ['maxPageviews', 'Max pageviews'], ['minQScore', 'Min quality score'], ['maxQScore', 'Max quality score'],
  ['minAtk', 'Min ATK'], ['maxAtk', 'Max ATK'], ['minDef', 'Min DEF'], ['maxDef', 'Max DEF'], ['minPrice', 'Min current price'], ['maxCurrentPrice', 'Max current price']];
const TXT = [['titleContains', 'Title contains (ignores accents and case)'], ['titleRegex', 'Title matches (regex)'], ['categoryRegex', 'Category matches (regex)']];

const SETTINGS = [
  ['Timing (bids)', [
    ['timing.targetRemainingMs', 'num', 'Bid lands this long before the end (ms)', 'Must stay above 10000, otherwise the bid extends the auction.'],
    ['timing.extraBidLatencyMs', 'num', 'Send bids this much earlier (ms)', 'Raise it if the log says an auction was extended by your bid.'],
    ['timing.jitterMs', 'num', 'Random timing jitter (± ms)'],
    ['timing.preCheckLeadMs', 'num', 'Re-check the auction this long before firing (ms)'],
    ['timing.horizonMinutes', 'num', 'Plan non-wishlist bids this far ahead (min)'],
    ['timing.maxPages', 'num', 'Auction pages scanned per poll'],
    ['timing.pollSeconds', 'num', 'Poll interval (s)', 'How often the bot scans the auctions ending soonest. Restart needed.'],
    ['timing.searchBudgetSeconds', 'num', 'Wishlist / keyword search time per scan (s)', 'Each wishlist card and keyword rule is one heavy search. The bot works through them in slices of this many seconds per scan, so a slow site means fewer per scan, not more load.'],
    ['timing.scanBudgetSeconds', 'num', 'Time limit for the ending-soon scan (s)'],
  ]],
  ['Safety limits', [
    ['global.dailySpendCap', 'num', 'Daily spend cap', 'Counts auctions you won today plus bids still held. Bids you are outbid on (and get refunded) do not count. Resets at midnight UTC and when the bot restarts.'],
    ['global.reserveBalance', 'num', 'Balance to always keep'],
    ['global.maxSnipesPerHour', 'num', 'Max bids per hour'],
    ['global.minGapBetweenBidsMs', 'num', 'Minimum gap between bids (ms)'],
    ['global.counters', 'num', 'Counter-bids per auction if outbid', 'After our snipe, if someone outbids us the bot queues a new snipe, up to this many times. 0 = never. Each rule can override it.'],
    ['global.skipOwned', 'bool', 'Skip cards I already own'],
    ['dryRun', 'bool', 'Force dry-run (never bid, never open packs)', 'Restart needed.'],
  ]],
  ['Targets', [
    ['targets.enabled', 'bool', 'Use the target list (Targets tab)', 'Off = the bot ignores targets; bid rules keep working.'],
    ['targets.increment', 'num', 'Bid this much above the current price on targets'],
    ['targets.reserveHorizonHours', 'num', 'Save money for higher-priority targets ending within (hours)', 'When money is short, a bid is skipped if it would leave too little for a higher-priority target whose auction ends within this many hours.'],
    ['targets.searchEveryScan', 'num', 'High-priority targets searched on every scan', 'Other targets and the wishlist take turns in the search time per scan.'],
  ]],
  ['Packs', [
    ['packs.enabled', 'bool', 'Open packs automatically'],
    ['packs.checkSeconds', 'num', 'Look for a free pack every (s)'],
    ['packs.jitterSeconds', 'num', 'Plus a random 0 to (s)'],
    ['packs.gapMs', 'range', 'Wait before each pack open (ms)'],
    ['packs.maxPerRun', 'num', 'Max packs per check'],
    ['packs.backoffMinutes', 'num', 'Pause after an error (min)'],
  ]],
  ['Selling (timing)', [
    ['sell.checkMinutes', 'num', 'Look for cards to list every (min)'],
    ['sell.lookupsPerRun', 'num', 'Price lookups per check', 'Each unpriced card needs one lookup; results are remembered for 30 minutes.'],
    ['sell.gapMs', 'range', 'Wait before each listing (ms)'],
    ['sell.lookupGapMs', 'range', 'Wait between price lookups (ms)'],
    ['sell.default', 'select', 'When no sell rule matches', '', ['keep', 'sell']],
  ]],
  ['Recycling', [
    ['recycle.keepIfWorthAtLeast', 'num', 'Never recycle cards that sell for at least', 'Uses the average sale price (checked before each recycle). Recycling pays about 1, so keep anything worth more and sell it instead.'],
    ['recycle.afterPackOpen', 'bool', 'Recycle right after opening a pack'],
    ['recycle.sweepExisting', 'bool', 'Also sweep my whole collection'],
    ['recycle.sweepMinutes', 'num', 'Sweep every (min)'],
    ['recycle.maxPerRun', 'num', 'Max recycled per run'],
    ['recycle.gapMs', 'range', 'Wait before each recycle (ms)'],
    ['recycle.default', 'select', 'When no recycle rule matches', '', ['keep', 'recycle']],
  ]],
];

let tab = 'dashboard';
let cfg = null, orig = null, dirty = false, state = null;

const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[last] = v; };
const markDirty = () => { dirty = true; $('#savebar').classList.add('show'); $('#savemsg').textContent = 'Unsaved changes'; $('#savemsg').className = ''; };
const fmtSec = (s) => (s < 0 ? 'now' : s < 90 ? `${s}s` : s < 5400 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`);
const clock = (iso) => new Date(iso).toLocaleTimeString();

/* ---------- dashboard ---------- */
function stat(label, value, sub) { return h('div', { class: 'stat' }, h('b', {}, value ?? '–'), h('span', {}, label + (sub ? ` · ${sub}` : ''))); }

/** Money this session: earned from recycling, spent on won cards, and the net balance change. */
function money(m) {
  if (!m) return null;
  const signed = (n) => (n == null ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n));
  const tile = (label, value, sub, cls) => h('div', { class: 'stat' }, h('b', { class: cls || '' }, value), h('span', {}, label + (sub ? ` · ${sub}` : '')));
  const netCls = m.net > 0 ? 'good' : m.net < 0 ? 'err' : '';
  return h('section', {},
    h('h2', {}, 'Money this session'),
    h('div', { class: 'grid', style: 'margin-bottom:8px' },
      tile('Net change', signed(m.net), m.startBalance == null ? '' : `${m.startBalance} → ${m.balance}`, netCls),
      tile('Earned (recycling)', signed(m.earnedRecycling), `${m.recycledCount} cards`, m.earnedRecycling ? 'good' : ''),
      tile('Spent (cards won)', m.spentOnWon ? '−' + m.spentOnWon : '0', `${m.won} won`, m.spentOnWon ? 'err' : ''),
      tile('Earned (sales)', signed(m.earnedSales || 0), `${m.soldCount || 0} sold`, m.earnedSales ? 'good' : ''),
      tile('Held in open bids', m.heldInBids, `${m.pending} waiting`),
      tile('Bid results', `${m.won} won / ${m.outbid} outbid`)),
    h('p', { class: 'hint', style: 'margin:0' }, 'Since the bot started. A bid is held until its auction ends; if someone outbids you it is refunded, so only won auctions count as spent. Net change also reflects refunds and anything you do on the site yourself.'));
}

/** Selling status: listings in use, results, and what the policy would list next. */
function selling(s) {
  if (!s) return null;
  const rows = (s.preview ?? []).map((p) => h('tr', {}, h('td', {}, p.title), h('td', {}, h('span', { class: 'chip' }, p.rarity)), h('td', {}, p.avg ?? 'no history'), h('td', {}, p.price)));
  return h('section', {},
    h('h2', {}, 'Selling ', h('span', { class: 'badge' + (s.enabled ? ' live' : '') }, s.enabled ? 'ON' : 'OFF')),
    h('p', { class: 'hint' }, s.active + '/' + s.max + ' listings in use · ' + (s.listed || 0) + ' listed this session · ' + (s.soldCount || 0) + ' sold for ' + (s.soldRevenue || 0) + ' · list price = ' + Math.round(s.factor * 100) + '% of the average sale price'),
    rows.length
      ? h('table', {}, h('thead', {}, h('tr', {}, ['Next candidates (highest price first)', 'Rarity', 'Average sale price', 'Would list at'].map((x) => h('th', {}, x)))), h('tbody', {}, rows))
      : h('p', { class: 'empty' }, s.enabled ? 'Nothing to list right now (no free slots, or no card matches a sell rule).' : 'Turn selling on and choose your rules on the Sell rules tab.'));
}

/* Manual scans. The dashboard redraws every 2 s, so "busy" comes from the bot's state and results are kept here. */
const scanMsg = {};
async function runScan(what) {
  scanMsg[what] = { text: 'Started from the dashboard', busy: true };
  drawView();
  const r = await api('/api/scan', { method: 'POST', body: JSON.stringify({ what }) }).catch(() => ({ ok: false, data: { error: 'the bot is not reachable' } }));
  scanMsg[what] = r.ok ? { text: 'Done: ' + r.data.done, cls: 'good' } : { text: r.data.error ?? 'failed', cls: 'err' };
  setTimeout(() => { delete scanMsg[what]; }, 15000);
  poll();
}
function scanControls(sc) {
  if (!sc) return null;
  const ago = (t) => { if (!t) return 'not yet'; const s = Math.round((Date.now() - t) / 1000); return s < 90 ? s + ' s ago' : Math.round(s / 60) + ' min ago'; };
  const item = (what, label, busy, busyLabel, last) => h('div', { class: 'scanitem' },
    h('button', { disabled: busy || scanMsg[what]?.busy, onclick: () => runScan(what) }, busy || scanMsg[what]?.busy ? busyLabel : label),
    h('span', { class: scanMsg[what]?.cls ?? 'hint' }, scanMsg[what]?.text ?? last));
  return h('div', { class: 'scanrow' },
    item('auctions', '↻ Scan auctions now', sc.running, 'Scanning…', `Last scan ${ago(sc.lastAt)}${sc.summary ? ' · ' + sc.summary : ''} · automatic every ${sc.everySec} s`),
    item('wishlist', '↻ Reload wishlist', sc.wishlistLoading, 'Reloading…', `Last reload ${ago(sc.wishlistAt)} · automatic every 30 s`));
}

function renderDashboard() {
  const s = state; if (!s) return h('p', { class: 'empty' }, 'Connecting…');
  const bidRows = s.recentBids.map((b) => h('tr', {},
    h('td', {}, clock(b.at)), h('td', {}, b.title ?? b.id?.slice(0, 8)), h('td', {}, b.amount),
    h('td', {}, b.dry ? 'dry-run' : b.status === 200 ? 'bid placed' : `failed${b.status ? ' (HTTP ' + b.status + ')' : ''}${b.body?.error ? ': ' + b.body.error : ''}`),
    h('td', {}, b.predictedRemainingMs ? `${(b.predictedRemainingMs / 1000).toFixed(1)}s before end` : ''),
    h('td', {}, b.extendedMs ? h('span', { class: 'err' }, `extended +${b.extendedMs / 1000}s`) : b.extendedMs === 0 ? h('span', { class: 'good' }, 'no') : '')));
  const planRows = s.plans.map((p) => h('tr', {},
    h('td', {}, p.title ?? p.id.slice(0, 8)), h('td', {}, h('span', { class: 'chip' }, p.rarity ?? '?')), h('td', {}, p.amount), h('td', {}, p.rule),
    h('td', {}, fmtSec(p.fireInSec)), h('td', {}, clock(p.endAt))));
  return h('div', {},
    s.packs?.blocked && h('div', { class: 'banner' },
      h('div', {}, h('b', {}, '⚠ ' + s.packs.blocked.title), h('div', { style: 'font-size:12px;opacity:.9;margin-top:2px' },
        s.packs.blocked.detail + ' Next automatic try: ' + new Date(s.packs.blocked.until).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.')),
      h('button', { class: 'primary', onclick: async (e) => {
        const b = e.currentTarget; b.disabled = true; b.textContent = 'Trying…';
        const r = await api('/api/packs/retry', { method: 'POST', body: '{}' });
        b.textContent = r.ok ? 'Asked the bot to try' : (r.data.error ?? 'failed');
        setTimeout(() => { b.disabled = false; b.textContent = 'Retry now'; }, 6000);
      } }, 'Retry now')),
    !s.connected && h('div', { class: 'banner' }, h('span', {}, '⚠ ' + (s.sessionProblem ?? 'Not connected.')), h('button', { class: 'primary', onclick: () => { tab = 'connect'; draw(); } }, 'Connect now')),
    h('div', { class: 'grid' },
      stat('Balance', s.balance), stat('Committed today', `${s.spentToday} / ${s.dailySpendCap}`, 'won + held'),
      stat('Bids placed', s.stats.bidsOk, s.stats.bidsFailed ? `${s.stats.bidsFailed} failed` : ''),
      stat('Packs opened', s.stats.packs, s.packs?.blocked ? 'PAUSED until ' + new Date(s.packs.blocked.until).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : s.packs?.lastOpenedAt ? 'last ' + new Date(s.packs.lastOpenedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''), stat('Cards recycled', s.stats.recycled),
      stat('Wishlist cards', s.wishlistSize), stat('Session valid for', `${s.sessionMinLeft} min`),
      stat('Clock / latency', `${s.clock.offsetMs} ms`, `rtt ${s.clock.rttMs} ms`), stat('Uptime', fmtSec(s.uptimeSec))),
    scanControls(s.scan),
    money(s.money),
    selling(s.sell),
    h('section', {}, h('h2', {}, 'Upcoming snipes'),
      s.plans.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Card', 'Rarity', 'Bid', 'Rule', 'Fires in', 'Auction ends'].map((x) => h('th', {}, x)))), h('tbody', {}, planRows)) : h('p', { class: 'empty' }, 'Nothing planned. The bot looks for matching auctions continuously.')),
    h('section', {}, h('h2', {}, 'Recent bids'),
      s.recentBids.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Time', 'Card', 'Bid', 'Result', 'Landed', 'Extended?'].map((x) => h('th', {}, x)))), h('tbody', {}, bidRows)) : h('p', { class: 'empty' }, 'No bids yet.')),
    (s.extensions || []).length ? h('section', {}, h('h2', {}, 'Auction extensions seen'),
      h('p', { class: 'hint' }, 'When a bid lands in the last seconds the site moves the end time. This shows how much, so you can see how the extension works.'),
      h('table', {}, h('thead', {}, h('tr', {}, ['Time', 'Card', 'End moved by', 'Time left when it happened'].map((x) => h('th', {}, x)))),
        h('tbody', {}, s.extensions.map((e) => h('tr', {}, h('td', {}, clock(e.at)), h('td', {}, e.title ?? ''), h('td', {}, '+' + (e.movedMs / 1000) + 's'), h('td', {}, e.msLeftWhenSeen != null ? (e.msLeftWhenSeen / 1000).toFixed(1) + 's' : '')))))) : null,
    h('section', {}, h('h2', {}, 'Live log'), h('pre', { id: 'log' }, s.log.join('\n'))));
}

/* ---------- rule editor ---------- */
function ruleCard(list, i, kind) {
  const r = list[i];
  r.when ??= {};
  const w = r.when;
  const refresh = () => { markDirty(); draw(); };
  const tri = ([k, label]) => h('label', { class: 'f' }, label,
    h('select', { onchange: (e) => { const v = e.target.value; if (v === '') delete w[k]; else w[k] = v === 'yes'; markDirty(); } },
      h('option', { value: '' }, 'any'), h('option', { value: 'yes' }, 'yes'), h('option', { value: 'no' }, 'no')));
  const triEls = TRI.map((t) => { const el = tri(t); el.querySelector('select').value = w[t[0]] === undefined ? '' : w[t[0]] ? 'yes' : 'no'; return el; });
  const num = ([k, label]) => (kind === 'recycle' && /Price|Current/.test(k) ? null : h('label', { class: 'f' }, label,
    h('input', { type: 'number', value: w[k] ?? '', oninput: (e) => { e.target.value === '' ? delete w[k] : (w[k] = Number(e.target.value)); markDirty(); } })));
  const txt = ([k, label]) => h('label', { class: 'f' }, label,

/**
 * Button that needs several clicks: one to arm, one more to confirm, and one extra step for protected cards
 * (bought by the bot, or matching a bid rule). Protected buttons carry a 🔒.
 */
function stagedButton({ label, steps, run, danger, tip }) {
  let step = 0;
  let timer;
  const btn = h('button', { class: danger ? 'danger' : '', title: tip ?? '', onclick: async () => {
    clearTimeout(timer);
    if (step < steps.length) {
      btn.textContent = steps[step++];
      timer = setTimeout(() => { if (btn.isConnected) { step = 0; btn.textContent = label; } }, 5000);
      return;
    }
    btn.disabled = true;
    btn.textContent = '…';
    const r = await run();
    if (r.ok) btn.replaceWith(h('span', { class: 'good', title: r.done }, r.done));
    else {
      btn.disabled = false;
      step = 0;
      btn.textContent = '⚠ failed';
      btn.title = r.error;
      timer = setTimeout(() => { if (btn.isConnected) { btn.textContent = label; btn.title = tip ?? ''; } }, 4000);
    }
  } }, label);
  return btn;
}

  const themeNames = rep.themes.map((t) => t.name);
  if (!tg.addTheme && themeNames.length) tg.addTheme = themeNames[0];
  const lim = rep.limits ?? {};
  const fmtLeft = (iso) => fmtSec(Math.round((Date.parse(iso) - Date.now()) / 1000));

  // themes and budgets
  const themeRows = rep.themes.map((t) => {
    const budget = h('input', { type: 'number', value: t.weeklyBudget ?? '', placeholder: 'no budget', style: 'width:110px', onchange: (e) => targetOp([{ op: 'theme', name: t.name, weeklyBudget: e.target.value === '' ? null : Number(e.target.value) }]) });
    const on = h('input', { type: 'checkbox', checked: t.enabled !== false, onchange: (e) => targetOp([{ op: 'theme', name: t.name, enabled: e.target.checked }]) });
    return h('tr', {}, h('td', {}, h('b', {}, t.name), t.note ? h('div', { class: 'hint', style: 'margin:0' }, t.note) : ''), h('td', {}, budget), h('td', {}, String(t.spent7d)), h('td', {}, String(t.held)),
      h('td', {}, t.left == null ? '–' : String(t.left)), h('td', {}, `${t.targets} (${t.owned} owned)`), h('td', {}, h('label', {}, on, ' on')),
      h('td', { class: 'actions' }, h('button', { class: 'danger', title: 'Remove this theme (only when it has no targets)', onclick: () => confirm(`Remove theme ${t.name}?`) && targetOp([{ op: 'removeTheme', name: t.name }]) }, '✕')));
  });
  const newTheme = h('input', { type: 'text', placeholder: 'new theme, e.g. jeux-video', style: 'max-width:220px' });
  const newBudget = h('input', { type: 'number', placeholder: 'weekly budget', style: 'max-width:140px' });

  // targets
  let list = rep.targets;
  if (tg.theme) list = list.filter((t) => (t.theme ?? '') === tg.theme);
  if (!tg.showAll) list = list.filter((t) => t.status === 'active' && !t.owned);
  list.sort((a, b) => (a.auction ? 0 : 1) - (b.auction ? 0 : 1) || a.priority - b.priority || b.maxBid - a.maxBid);
  const tRows = list.map((t) => {
    const prio = h('select', { onchange: (e) => targetOp([{ op: 'update', cardId: t.cardId, priority: Number(e.target.value) }]) }, ...[1, 2, 3].map((p) => h('option', { value: p, selected: t.priority === p }, PRIO[p])));
    prio.value = String(t.priority);
    const max = h('input', { type: 'number', value: t.maxBid, style: 'width:80px', onchange: (e) => targetOp([{ op: 'update', cardId: t.cardId, maxBid: Number(e.target.value) }]) });
    const status = t.owned ? h('span', { class: 'good' }, 'owned ✓')
      : t.auction ? h('span', {}, (t.auction.leading ? '🟢 leading at ' : 'on sale: ') + t.auction.price + ' · ends in ' + fmtLeft(t.auction.endsAt) + (t.auction.planned ? ' · snipe planned' : ''))
      : t.status !== 'active' ? h('span', { class: 'hint' }, t.status) : h('span', { class: 'hint' }, 'waiting for an auction');
    return h('tr', {}, h('td', {}, prio), h('td', {}, t.title, ' ', h('span', { class: 'chip' }, t.rarity ?? '?')), h('td', {}, t.theme ?? '–'), h('td', {}, max,
      t.effectiveMaxBid != null && t.effectiveMaxBid < t.maxBid ? h('div', { class: 'hint', style: 'margin:0' }, 'capped at ' + t.effectiveMaxBid) : ''),
      h('td', {}, status), h('td', { class: 'hint', style: 'max-width:260px' }, t.reason ?? ''), h('td', { class: 'hint' }, t.addedBy ?? ''),
      h('td', { class: 'actions' }, h('button', { class: 'danger', title: 'Remove from targets', onclick: () => targetOp([{ op: 'remove', cardId: t.cardId }]) }, '✕')));
  });

  // add cards by searching the game's catalog
  const q = h('input', { type: 'text', placeholder: 'Search the game for cards (title or description)…', style: 'max-width:340px' });
  const rar = h('input', { type: 'text', placeholder: 'rarities, e.g. SR,UR,L', style: 'max-width:160px' });
  const doSearch = async () => {
    if (!q.value.trim()) return;
    tg.searching = true; loadTargetsResults();
    const r = await api('/api/catalog?' + new URLSearchParams({ text: q.value.trim(), rarity: rar.value.trim(), limit: '40' }));
    tg.searching = false;
    tg.results = r.ok ? r.data.cards : { error: r.data.error };
    loadTargetsResults();
  };
  q.addEventListener('keydown', (e) => e.key === 'Enter' && doSearch());
  const addTheme = h('select', { onchange: (e) => (tg.addTheme = e.target.value) }, h('option', { value: '' }, '(no theme)'), ...themeNames.map((n) => h('option', { value: n, selected: tg.addTheme === n }, n)));
  addTheme.value = tg.addTheme;
  const addPrio = h('select', { onchange: (e) => (tg.addPriority = Number(e.target.value)) }, ...[1, 2, 3].map((p) => h('option', { value: p, selected: tg.addPriority === p }, PRIO[p])));
  addPrio.value = String(tg.addPriority);
  const addMax = h('input', { type: 'number', value: tg.addMax, style: 'width:90px', oninput: (e) => (tg.addMax = Number(e.target.value)) });

  const L = (k, label) => (lim[k] != null ? h('div', { class: 'stat' }, h('b', {}, lim[k]), h('span', {}, label)) : null);
  const limitTiles = [L('maxBidPerCard', 'Max bid per card'), L('maxDailySpend', 'Max spend per day'), L('maxWeeklySpend', 'Max spend per 7 days'), L('minReserve', 'Balance always kept'), L('maxThemeBudget', 'Max theme budget')].filter(Boolean);
  const journalRows = (j.ok ? j.data.entries : []).map((e) => h('tr', {}, h('td', { class: 'hint', style: 'white-space:nowrap' }, new Date(e.at).toLocaleString()), h('td', {}, h('span', { class: 'chip' }, e.by ?? '')), h('td', {}, e.text ?? '', e.reason ? h('div', { class: 'hint', style: 'margin:0' }, 'why: ' + e.reason) : '')));

  $('#tgbox').replaceChildren(
    h('p', { class: 'hint' }, 'Targets are specific cards you want, each with its own max bid and a priority. They come before the bid rules. Themes group targets and can have a weekly budget (wins in the last 7 days + bids still running). When money is short, the bot keeps enough for higher-priority targets whose auctions end within the next few hours. Cards on this list are never sold or recycled automatically. Changes apply within seconds; the agent (npm run agent) edits the same list.'),
    h('div', { class: 'grid' },
      stat('Balance', rep.balance, 'keeps ' + rep.reserve),
      stat('Spent, last 7 days', rep.spend.last7days, rep.spend.heldInBids ? rep.spend.heldInBids + ' held in bids' : ''),
      stat('Won / lost, 7 days', rep.last7days.won + ' / ' + rep.last7days.lost),
      stat('Active targets', rep.targets.filter((t) => t.status === 'active' && !t.owned).length, rep.targets.filter((t) => t.auction).length + ' on sale now')),
    rep.targetsEnabled ? '' : h('div', { class: 'banner' }, h('span', {}, 'Targets are switched off (targets.enabled = false in config.json): the bot ignores this list.')),
    h('section', {}, h('h2', {}, 'Themes and weekly budgets'),
      themeRows.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Theme', 'Weekly budget', 'Spent (7 d)', 'Held', 'Left', 'Targets', '', ''].map((x) => h('th', {}, x)))), h('tbody', {}, themeRows)) : h('p', { class: 'empty' }, 'No themes yet.'),
      h('div', { class: 'actionrow' }, newTheme, newBudget, h('button', { onclick: () => newTheme.value.trim() && targetOp([{ op: 'theme', name: newTheme.value.trim().toLowerCase(), weeklyBudget: newBudget.value === '' ? null : Number(newBudget.value) }]) }, 'Add theme'))),
    h('section', {}, h('h2', {}, 'Add cards'),
      h('div', { class: 'actionrow', style: 'margin-top:0' }, q, rar, h('button', { class: 'primary', onclick: doSearch }, 'Search')),
      h('div', { class: 'actionrow' }, h('label', { class: 'f' }, 'Theme', addTheme), h('label', { class: 'f' }, 'Priority', addPrio), h('label', { class: 'f' }, 'Max bid', addMax)),
      h('div', { id: 'tgresults', style: 'margin-top:10px' })),
    h('section', {}, h('h2', {}, 'Targets'),
      h('div', { class: 'actionrow', style: 'margin:0 0 10px' },
        h('select', { onchange: (e) => { tg.theme = e.target.value; loadTargets(); } }, h('option', { value: '' }, 'All themes'), ...themeNames.map((n) => h('option', { value: n, selected: tg.theme === n }, n))),
        h('label', {}, h('input', { type: 'checkbox', checked: tg.showAll, onchange: (e) => { tg.showAll = e.target.checked; loadTargets(); } }), ' also show owned, expired and switched-off')),
      tRows.length ? h('div', { style: 'overflow-x:auto' }, h('table', {}, h('thead', {}, h('tr', {}, ['Priority', 'Card', 'Theme', 'Max bid', 'Status', 'Why', 'Added by', ''].map((x) => h('th', {}, x)))), h('tbody', {}, tRows)))
        : h('p', { class: 'empty' }, rep.targets.length ? 'Nothing to show with these filters.' : 'No targets yet. Search for cards above, or let the agent find them.')),
    h('section', {}, h('h2', {}, 'Hard limits (limits.json)'),
      limitTiles.length ? h('div', { class: 'grid', style: 'margin-bottom:6px' }, ...limitTiles) : h('p', { class: 'empty' }, 'None set.'),
      h('p', { class: 'hint' }, 'These apply to every bid, from rules and targets alike, and the agent is not allowed to change them. Edit limits.json by hand (copy limits.example.json); the bot picks it up within seconds.')),
    h('section', {}, h('h2', {}, 'Journal (who changed what, and why)'),
      journalRows.length ? h('table', {}, h('tbody', {}, journalRows)) : h('p', { class: 'empty' }, 'Nothing yet.')));
  loadTargetsResults();
}

function loadTargetsResults() {
  const box = $('#tgresults');
  if (!box) return;
  if (tg.searching) return box.replaceChildren(h('p', { class: 'empty' }, 'Searching… (the catalog is big, this can take a few seconds)'));
  if (!tg.results) return box.replaceChildren();
  if (tg.results.error) return box.replaceChildren(h('p', { class: 'err' }, tg.results.error));
  const rows = tg.results.map((c) => h('tr', {}, h('td', {}, c.title), h('td', {}, h('span', { class: 'chip' }, c.rarity)), h('td', {}, String(c.pageviews)), h('td', { class: 'hint' }, c.category),
    h('td', { class: 'actions' }, h('button', { onclick: async (e) => {
      e.currentTarget.disabled = true;
      const ok = await targetOp([{ op: 'add', cardId: c.cardId, title: c.title, rarity: c.rarity, theme: tg.addTheme || null, priority: tg.addPriority, maxBid: tg.addMax }]);
      if (ok) e.target.replaceWith(h('span', { class: 'good' }, 'added'));
    } }, '+ Target'))));
  box.replaceChildren(rows.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Card', 'Rarity', 'Pageviews', 'Description', ''].map((x) => h('th', {}, x)))), h('tbody', {}, rows)) : h('p', { class: 'empty' }, 'No cards found.'));
}

/* ---------- shell ---------- */
const TABS = [['dashboard', 'Dashboard'], ['targets', 'Targets'], ['cards', 'Cards'], ['value', 'Value'], ['bid', 'Bid rules'], ['recycle', 'Recycle rules'], ['sell', 'Sell rules'], ['settings', 'Settings'], ['connect', 'Connect']];
function drawTabs() {
  $('#tabs').replaceChildren(...TABS.map(([id, label]) => h('button', { class: tab === id ? 'on' : '', onclick: () => { tab = id; draw(); } }, label)));
}
function draw() { drawTabs(); drawView(); }
function drawView() {
  const v = $('#view');
  if (tab === 'dashboard') { v.replaceChildren(renderDashboard()); const l = $('#log'); if (l) l.scrollTop = l.scrollHeight; }
  else if (tab === 'connect') v.replaceChildren(renderConnect());
  else if (tab === 'cards') { v.replaceChildren(renderCards()); loadCards(); }
  else if (tab === 'targets') { v.replaceChildren(renderTargets()); loadTargets(); }
  else if (tab === 'value') { v.replaceChildren(h('div', { id: 'valuebox' }, h('p', { class: 'empty' }, 'Loading…'))); loadValues(); }
  else if (!cfg) v.replaceChildren(h('p', { class: 'empty' }, 'Loading settings…'));
  else v.replaceChildren(tab === 'bid' ? renderRules('bid') : tab === 'recycle' ? renderRules('recycle') : tab === 'sell' ? renderRules('sell') : renderSettings());
}

async function poll() {
  const r = await api('/api/state').catch(() => null);
  if (r?.ok) {
    state = r.data;
    if (!state.connected && !window.__jumped && !state.sessionProblem?.includes('rejected')) { window.__jumped = true; tab = 'connect'; draw(); }
    const m = $('#mode');
    m.textContent = state.paused ? 'PAUSED' : state.mode === 'live' ? 'LIVE' : 'DRY-RUN';
    m.className = 'badge ' + (state.paused ? 'paused' : state.mode === 'live' ? 'live' : 'dry');
    $('#pause').textContent = state.paused ? 'Resume' : 'Pause';
    if (tab === 'cards' && !window.__cardsBusy) loadCards();
    // refresh the Targets tab every 20 s, but not while you are typing in it
    if (tab === 'targets' && Date.now() - (window.__tgAt || 0) > 20000 && !$('#tgbox')?.contains(document.activeElement)) loadTargets();
    if (tab === 'value' && !window.__valuesBusy && Date.now() - (window.__valuesAt || 0) > 15000) loadValues();
    if (tab === 'dashboard') { const l = $('#log'); const stick = !l || l.scrollTop + l.clientHeight >= l.scrollHeight - 30; drawView(); if (stick) { const n = $('#log'); if (n) n.scrollTop = n.scrollHeight; } }
  } else { $('#mode').textContent = 'offline'; $('#mode').className = 'badge paused'; }
}
let cfgVersion = null;
async function loadConfig() { const r = await api('/api/config'); cfg = r.data.config; cfgVersion = r.data.version; orig = JSON.stringify(cfg); dirty = false; $('#savebar').classList.remove('show'); draw(); }

$('#pause').onclick = async () => { await api('/api/pause', { method: 'POST', body: JSON.stringify({ paused: !state?.paused }) }); poll(); };
$('#discard').onclick = () => loadConfig();
$('#save').onclick = async () => {
  const r = await api('/api/config', { method: 'PUT', body: JSON.stringify({ version: cfgVersion, config: cfg }) });
  if (r.ok) cfgVersion = r.data.version;
  const m = $('#savemsg');
  if (r.ok) { m.textContent = 'Saved. The bot applies it within a few seconds.'; m.className = 'good'; dirty = false; setTimeout(() => $('#savebar').classList.remove('show'), 2500); }
  else { m.textContent = 'Not saved: ' + (r.data.errors ?? [r.data.error]).join('; '); m.className = 'err'; }
};
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

loadConfig();
poll();
setInterval(poll, 2000);
</script>
