<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WikiMasters Bot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6eb;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a5; --line: #262c35; --accent: #5b8def; --chip: #212833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  .badge { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--chip); }
  .badge.live { background: var(--ok); color: #fff; } .badge.dry { background: var(--warn); color: #fff; } .badge.paused { background: var(--bad); color: #fff; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
  nav button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 90px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); padding: 6px 0; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
  pre#log { margin: 0; max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .rule { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
  .rule.off { opacity: .55; }
  .rule-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rule-head input[type=text] { flex: 1; min-width: 140px; }
  .conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin-top: 10px; }
  label.f { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  input[type=text], input[type=number], select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); width: 100%; }
  .rar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 30px; }
  .rar label { display: flex; align-items: center; gap: 3px; color: var(--text); font-size: 13px; }
  .actionrow { display: flex; gap: 10px; align-items: end; margin-top: 10px; flex-wrap: wrap; }
  .actionrow label.f { width: 140px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: minmax(200px, 1fr) 260px; gap: 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row small { display: block; color: var(--muted); }
  .range { display: flex; gap: 6px; }
  #savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: none; gap: 12px; align-items: center; }
  #savebar.show { display: flex; }
  #savemsg { flex: 1; } .err { color: var(--bad); } .good { color: var(--ok); }
  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--bad); color: #fff; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  textarea { width: 100%; font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  ol.steps { padding-left: 20px; margin: 0 0 14px; } ol.steps li { margin-bottom: 8px; }
  code.cmd { background: var(--chip); padding: 2px 8px; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>WikiMasters Bot</h1>
  <span id="mode" class="badge">…</span>
  <button id="pause">Pause</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="savebar"><span id="savemsg"></span><button id="discard">Discard</button><button id="save" class="primary">Save changes</button></div>

<script>
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'x-bot-ui': '1', 'content-type': 'application/json' } }).then(async (r) => ({ ok: r.ok, data: await r.json().catch(() => ({})) }));

const RARITIES = ['C', 'PC', 'R', 'SR', 'UR', 'L'];
const RARITY_NAMES = { C: 'Commune', PC: 'Peu commune', R: 'Rare', SR: 'Super rare', UR: 'Ultra rare', L: 'Légendaire' };
const TRI = [['wishlist', 'On my wishlist'], ['shiny', 'Shiny'], ['starred', 'Starred'], ['tagged', 'Has a tag']];
const NUMS = [['minPageviews', 'Min pageviews'], ['maxPageviews', 'Max pageviews'], ['minQScore', 'Min quality score'], ['maxQScore', 'Max quality score'],
  ['minAtk', 'Min ATK'], ['maxAtk', 'Max ATK'], ['minDef', 'Min DEF'], ['maxDef', 'Max DEF'], ['minPrice', 'Min current price'], ['maxCurrentPrice', 'Max current price']];
const TXT = [['titleContains', 'Title contains (ignores accents and case)'], ['titleRegex', 'Title matches (regex)'], ['categoryRegex', 'Category matches (regex)']];

const SETTINGS = [
  ['Timing (bids)', [
    ['timing.targetRemainingMs', 'num', 'Bid lands this long before the end (ms)', 'Must stay above 10000, otherwise the bid extends the auction.'],
    ['timing.extraBidLatencyMs', 'num', 'Send bids this much earlier (ms)', 'Raise it if the log says an auction was extended by your bid.'],
    ['timing.counterRemainingMs', 'num', 'Counter-bid lead when the normal window has passed (ms)', 'A counter normally lands 11 s before the new end; if that moment is gone it lands this long before the end (and extends the auction again).'],
    ['timing.jitterMs', 'num', 'Random timing jitter (± ms)'],
    ['timing.preCheckLeadMs', 'num', 'Re-check the auction this long before firing (ms)'],
    ['timing.horizonMinutes', 'num', 'Plan non-wishlist bids this far ahead (min)'],
    ['timing.maxPages', 'num', 'Auction pages scanned per poll'],
    ['timing.pollSeconds', 'num', 'Poll interval (s)', 'How often the bot scans the auctions ending soonest. Restart needed.'],
    ['timing.searchBudgetSeconds', 'num', 'Wishlist / keyword search time per scan (s)', 'Each wishlist card and keyword rule is one heavy search. The bot works through them in slices of this many seconds per scan, so a slow site means fewer per scan, not more load.'],
    ['timing.scanBudgetSeconds', 'num', 'Time limit for the ending-soon scan (s)'],
  ]],
  ['Safety limits', [
    ['global.dailySpendCap', 'num', 'Daily spend cap', 'Counts auctions you won today plus bids still held. Bids you are outbid on (and get refunded) do not count. Resets at midnight UTC and when the bot restarts.'],
    ['global.reserveBalance', 'num', 'Balance to always keep'],
    ['global.maxSnipesPerHour', 'num', 'Max bids per hour'],
    ['global.minGapBetweenBidsMs', 'num', 'Minimum gap between bids (ms)'],
    ['global.counters', 'num', 'Counter-bids per auction if outbid', 'After our snipe, if someone outbids us the bot queues a new snipe, up to this many times. 0 = never. Each rule can override it.'],
    ['global.skipOwned', 'bool', 'Skip cards I already own'],
    ['dryRun', 'bool', 'Force dry-run (never bid, never open packs)', 'Restart needed.'],
  ]],
  ['Packs', [
    ['packs.enabled', 'bool', 'Open packs automatically'],
    ['packs.checkSeconds', 'num', 'Look for a free pack every (s)'],
    ['packs.jitterSeconds', 'num', 'Plus a random 0 to (s)'],
    ['packs.gapMs', 'range', 'Wait before each pack open (ms)'],
    ['packs.maxPerRun', 'num', 'Max packs per check'],
    ['packs.backoffMinutes', 'num', 'Pause after an error (min)'],
  ]],
  ['Selling (timing)', [
    ['sell.checkMinutes', 'num', 'Look for cards to list every (min)'],
    ['sell.lookupsPerRun', 'num', 'Price lookups per check', 'Each unpriced card needs one lookup; results are remembered for 30 minutes.'],
    ['sell.gapMs', 'range', 'Wait before each listing (ms)'],
    ['sell.lookupGapMs', 'range', 'Wait between price lookups (ms)'],
    ['sell.default', 'select', 'When no sell rule matches', '', ['keep', 'sell']],
  ]],
  ['Recycling', [
    ['recycle.afterPackOpen', 'bool', 'Recycle right after opening a pack'],
    ['recycle.sweepExisting', 'bool', 'Also sweep my whole collection'],
    ['recycle.sweepMinutes', 'num', 'Sweep every (min)'],
    ['recycle.maxPerRun', 'num', 'Max recycled per run'],
    ['recycle.gapMs', 'range', 'Wait before each recycle (ms)'],
    ['recycle.default', 'select', 'When no recycle rule matches', '', ['keep', 'recycle']],
  ]],
];

let tab = 'dashboard';
let cfg = null, orig = null, dirty = false, state = null;

const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[last] = v; };
const markDirty = () => { dirty = true; $('#savebar').classList.add('show'); $('#savemsg').textContent = 'Unsaved changes'; $('#savemsg').className = ''; };
const fmtSec = (s) => (s < 0 ? 'now' : s < 90 ? `${s}s` : s < 5400 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`);
const clock = (iso) => new Date(iso).toLocaleTimeString();

/* ---------- dashboard ---------- */
function stat(label, value, sub) { return h('div', { class: 'stat' }, h('b', {}, value ?? '–'), h('span', {}, label + (sub ? ` · ${sub}` : ''))); }

/** Money this session: earned from recycling, spent on won cards, and the net balance change. */
function money(m) {
  if (!m) return null;
  const signed = (n) => (n == null ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n));
  const tile = (label, value, sub, cls) => h('div', { class: 'stat' }, h('b', { class: cls || '' }, value), h('span', {}, label + (sub ? ` · ${sub}` : '')));
  const netCls = m.net > 0 ? 'good' : m.net < 0 ? 'err' : '';
  return h('section', {},
    h('h2', {}, 'Money this session'),
    h('div', { class: 'grid', style: 'margin-bottom:8px' },
      tile('Net change', signed(m.net), m.startBalance == null ? '' : `${m.startBalance} → ${m.balance}`, netCls),
      tile('Earned (recycling)', signed(m.earnedRecycling), `${m.recycledCount} cards`, m.earnedRecycling ? 'good' : ''),
      tile('Spent (cards won)', m.spentOnWon ? '−' + m.spentOnWon : '0', `${m.won} won`, m.spentOnWon ? 'err' : ''),
      tile('Earned (sales)', signed(m.earnedSales || 0), `${m.soldCount || 0} sold`, m.earnedSales ? 'good' : ''),
      tile('Held in open bids', m.heldInBids, `${m.pending} waiting`),
      tile('Bid results', `${m.won} won / ${m.outbid} outbid`)),
    h('p', { class: 'hint', style: 'margin:0' }, 'Since the bot started. A bid is held until its auction ends; if someone outbids you it is refunded, so only won auctions count as spent. Net change also reflects refunds and anything you do on the site yourself.'));
}

/** Selling status: listings in use, results, and what the policy would list next. */
function selling(s) {
  if (!s) return null;
  const rows = (s.preview ?? []).map((p) => h('tr', {}, h('td', {}, p.title), h('td', {}, h('span', { class: 'chip' }, p.rarity)), h('td', {}, p.avg ?? 'no history'), h('td', {}, p.price)));
  return h('section', {},
    h('h2', {}, 'Selling ', h('span', { class: 'badge' + (s.enabled ? ' live' : '') }, s.enabled ? 'ON' : 'OFF')),
    h('p', { class: 'hint' }, s.active + '/' + s.max + ' listings in use · ' + (s.listed || 0) + ' listed this session · ' + (s.soldCount || 0) + ' sold for ' + (s.soldRevenue || 0) + ' · list price = ' + Math.round(s.factor * 100) + '% of the average sale price'),
    rows.length
      ? h('table', {}, h('thead', {}, h('tr', {}, ['Next candidates (highest price first)', 'Rarity', 'Average sale price', 'Would list at'].map((x) => h('th', {}, x)))), h('tbody', {}, rows))
      : h('p', { class: 'empty' }, s.enabled ? 'Nothing to list right now (no free slots, or no card matches a sell rule).' : 'Turn selling on and choose your rules on the Sell rules tab.'));
}

function renderDashboard() {
  const s = state; if (!s) return h('p', { class: 'empty' }, 'Connecting…');
  const bidRows = s.recentBids.map((b) => h('tr', {},
    h('td', {}, clock(b.at)), h('td', {}, b.title ?? b.id?.slice(0, 8)), h('td', {}, b.amount),
    h('td', {}, b.dry ? 'dry-run' : b.status === 200 ? 'bid placed' : `failed${b.status ? ' (HTTP ' + b.status + ')' : ''}${b.body?.error ? ': ' + b.body.error : ''}`),
    h('td', {}, b.predictedRemainingMs ? `${(b.predictedRemainingMs / 1000).toFixed(1)}s before end` : ''),
    h('td', {}, b.extendedMs ? h('span', { class: 'err' }, `extended +${b.extendedMs / 1000}s`) : b.extendedMs === 0 ? h('span', { class: 'good' }, 'no') : '')));
  const planRows = s.plans.map((p) => h('tr', {},
    h('td', {}, p.title ?? p.id.slice(0, 8)), h('td', {}, h('span', { class: 'chip' }, p.rarity ?? '?')), h('td', {}, p.amount), h('td', {}, p.rule),
    h('td', {}, fmtSec(p.fireInSec)), h('td', {}, clock(p.endAt))));
  return h('div', {},
    !s.connected && h('div', { class: 'banner' }, h('span', {}, '⚠ ' + (s.sessionProblem ?? 'Not connected.')), h('button', { class: 'primary', onclick: () => { tab = 'connect'; draw(); } }, 'Connect now')),
    h('div', { class: 'grid' },
      stat('Balance', s.balance), stat('Committed today', `${s.spentToday} / ${s.dailySpendCap}`, 'won + held'),
      stat('Bids placed', s.stats.bidsOk, s.stats.bidsFailed ? `${s.stats.bidsFailed} failed` : ''),
      stat('Packs opened', s.stats.packs), stat('Cards recycled', s.stats.recycled),
      stat('Wishlist cards', s.wishlistSize), stat('Session valid for', `${s.sessionMinLeft} min`),
      stat('Clock / latency', `${s.clock.offsetMs} ms`, `rtt ${s.clock.rttMs} ms`), stat('Uptime', fmtSec(s.uptimeSec))),
    money(s.money),
    selling(s.sell),
    h('section', {}, h('h2', {}, 'Upcoming snipes'),
      s.plans.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Card', 'Rarity', 'Bid', 'Rule', 'Fires in', 'Auction ends'].map((x) => h('th', {}, x)))), h('tbody', {}, planRows)) : h('p', { class: 'empty' }, 'Nothing planned. The bot looks for matching auctions continuously.')),
    h('section', {}, h('h2', {}, 'Recent bids'),
      s.recentBids.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Time', 'Card', 'Bid', 'Result', 'Landed', 'Extended?'].map((x) => h('th', {}, x)))), h('tbody', {}, bidRows)) : h('p', { class: 'empty' }, 'No bids yet.')),
    (s.extensions || []).length ? h('section', {}, h('h2', {}, 'Auction extensions seen'),
      h('p', { class: 'hint' }, 'When a bid lands in the last seconds the site moves the end time. This shows how much, so you can see how the extension works.'),
      h('table', {}, h('thead', {}, h('tr', {}, ['Time', 'Card', 'End moved by', 'Time left when it happened'].map((x) => h('th', {}, x)))),
        h('tbody', {}, s.extensions.map((e) => h('tr', {}, h('td', {}, clock(e.at)), h('td', {}, e.title ?? ''), h('td', {}, '+' + (e.movedMs / 1000) + 's'), h('td', {}, e.msLeftWhenSeen != null ? (e.msLeftWhenSeen / 1000).toFixed(1) + 's' : '')))))) : null,
    h('section', {}, h('h2', {}, 'Live log'), h('pre', { id: 'log' }, s.log.join('\n'))));
}

/* ---------- rule editor ---------- */
function ruleCard(list, i, kind) {
  const r = list[i];
  r.when ??= {};
  const w = r.when;
  const refresh = () => { markDirty(); draw(); };
  const tri = ([k, label]) => h('label', { class: 'f' }, label,
    h('select', { onchange: (e) => { const v = e.target.value; if (v === '') delete w[k]; else w[k] = v === 'yes'; markDirty(); } },
      h('option', { value: '' }, 'any'), h('option', { value: 'yes' }, 'yes'), h('option', { value: 'no' }, 'no')));
  const triEls = TRI.map((t) => { const el = tri(t); el.querySelector('select').value = w[t[0]] === undefined ? '' : w[t[0]] ? 'yes' : 'no'; return el; });
  const num = ([k, label]) => (kind === 'recycle' && /Price|Current/.test(k) ? null : h('label', { class: 'f' }, label,
    h('input', { type: 'number', value: w[k] ?? '', oninput: (e) => { e.target.value === '' ? delete w[k] : (w[k] = Number(e.target.value)); markDirty(); } })));
  const txt = ([k, label]) => h('label', { class: 'f' }, label,
    h('input', { type: 'text', value: w[k] ?? '', oninput: (e) => { e.target.value === '' ? delete w[k] : (w[k] = e.target.value); markDirty(); } }));
  const rarity = h('label', { class: 'f' }, 'Rarity',
    h('div', { class: 'rar' }, RARITIES.map((x) => h('label', { title: RARITY_NAMES[x] }, h('input', { type: 'checkbox', checked: (w.rarity ?? []).includes(x), onchange: (e) => {
      const set_ = new Set(w.rarity ?? []); e.target.checked ? set_.add(x) : set_.delete(x);
      set_.size ? (w.rarity = RARITIES.filter((y) => set_.has(y))) : delete w.rarity; markDirty(); } }), x))));

  let action;
  if (kind === 'recycle' || kind === 'sell') {
    const verb = kind === 'sell' ? 'sell' : 'recycle';
    action = [
      h('label', { class: 'f' }, 'Then',
        h('select', { onchange: (e) => { r.action = e.target.value; refresh(); } }, ['keep', verb].map((a) => h('option', { value: a, selected: r.action === a }, a === 'keep' ? 'Keep the card' : (kind === 'sell' ? 'Sell the card' : 'Recycle the card'))))),
      kind === 'sell' && r.action === 'sell' && h('label', { class: 'f' }, 'List at % of average',
        h('input', { type: 'number', min: '1', max: '200', placeholder: String(Math.round(cfg.sell.priceFactor * 100)), value: r.priceFactor ? Math.round(r.priceFactor * 100) : '', oninput: (e) => { e.target.value === '' ? delete r.priceFactor : (r.priceFactor = Number(e.target.value) / 100); markDirty(); } })),
      kind === 'sell' && r.action === 'sell' && h('label', { class: 'f' }, 'Listing length',
        h('select', { onchange: (e) => { e.target.value === '' ? delete r.durationMinutes : (r.durationMinutes = Number(e.target.value)); markDirty(); } },
          h('option', { value: '' }, 'default'), [[10, '10 min'], [30, '30 min'], [60, '1 hour'], [180, '3 hours'], [360, '6 hours'], [720, '12 hours']].map(([v, l]) => h('option', { value: v, selected: r.durationMinutes === v }, l)))),
    ];
  } else {
    r.bid ??= { max: 1, increment: 1 };
    action = [
      h('label', { class: 'f' }, 'Then',
        h('select', { onchange: (e) => { if (e.target.value === 'skip') { r.skip = true; } else { delete r.skip; r.bid ??= { max: 1, increment: 1 }; } refresh(); } },
          h('option', { value: 'bid', selected: !r.skip }, 'Bid'), h('option', { value: 'skip', selected: !!r.skip }, 'Never bid'))),
      !r.skip && h('label', { class: 'f' }, 'Highest bid I will place',
        h('input', { type: 'number', value: r.bid.max, oninput: (e) => { r.bid.max = Number(e.target.value); markDirty(); } })),
      !r.skip && h('label', { class: 'f' }, 'Raise by',
        h('input', { type: 'number', value: r.bid.increment ?? 1, oninput: (e) => { r.bid.increment = Number(e.target.value); markDirty(); } })),
      !r.skip && h('label', { class: 'f' }, 'Also search the marketplace for',
        h('input', { type: 'text', placeholder: 'e.g. jeu vidéo', value: r.search ?? '', oninput: (e) => { e.target.value.trim() === '' ? delete r.search : (r.search = e.target.value); markDirty(); } })),
      !r.skip && h('label', { class: 'f' }, 'Counter-bids if outbid',
        h('input', { type: 'number', min: '0', placeholder: 'default', value: r.bid.counters ?? '', oninput: (e) => { e.target.value === '' ? delete r.bid.counters : (r.bid.counters = Number(e.target.value)); markDirty(); } })),
    ];
  }
  const move = (d) => { const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; refresh(); };
  return h('div', { class: 'rule' + (r.enabled === false ? ' off' : '') },
    h('div', { class: 'rule-head' },
      h('span', { class: 'chip' }, `#${i + 1}`),
      h('input', { type: 'text', value: r.name ?? '', placeholder: 'Rule name', oninput: (e) => { r.name = e.target.value; markDirty(); } }),
      h('label', {}, h('input', { type: 'checkbox', checked: r.enabled !== false, onchange: (e) => { e.target.checked ? delete r.enabled : (r.enabled = false); refresh(); } }), ' on'),
      h('button', { title: 'Move up (checked earlier)', onclick: () => move(-1) }, '▲'), h('button', { title: 'Move down', onclick: () => move(1) }, '▼'),
      h('button', { class: 'danger', onclick: (e) => {
        // Two-click confirm in the page itself: browser confirm() popups are blocked in some browsers.
        const b = e.currentTarget;
        if (b.dataset.armed) { list.splice(i, 1); refresh(); return; }
        b.dataset.armed = '1';
        b.textContent = 'Click again to delete';
        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Delete'; } }, 3000);
      } }, 'Delete')),
    h('div', { class: 'conds' }, rarity, triEls, NUMS.map(num), TXT.map(txt)),
    h('div', { class: 'actionrow' }, action));
}

function renderRules(kind) {
  const list = kind === 'bid' ? cfg.rules : kind === 'sell' ? cfg.sell.rules : cfg.recycle.rules;
  const S = cfg.sell;
  const numField = (label, get, put, attrs = {}) => h('label', { class: 'f' }, label, h('input', { type: 'number', ...attrs, value: get() ?? '', oninput: (e) => { put(e.target.value === '' ? null : Number(e.target.value)); markDirty(); } }));
  const head = kind === 'sell'
    ? h('div', {},
      h('p', { class: 'hint' }, 'Sells cards by policy: the cards with the highest expected price go on sale first, up to the site limit of 5 listings at a time. Each card is listed at a share of the average price it recently sold for (the figure the site shows when you sell). Cards on sale are never recycled. Rules are checked top to bottom; first match wins.'),
      h('section', {},
        h('label', {}, h('input', { type: 'checkbox', checked: S.enabled, onchange: (e) => { S.enabled = e.target.checked; markDirty(); } }), ' Selling is ', h('b', {}, 'enabled'), ' (when off, nothing is listed)'),
        h('div', { class: 'conds' },

          h('label', { class: 'f' }, 'Listing length', h('select', { onchange: (e) => { S.durationMinutes = Number(e.target.value); markDirty(); } },
            [[10, '10 min'], [30, '30 min'], [60, '1 hour'], [180, '3 hours'], [360, '6 hours'], [720, '12 hours']].map(([v, l]) => h('option', { value: v, selected: S.durationMinutes === v }, l)))),
          numField('Max listings at once (site limit 5)', () => S.maxListings, (v) => { if (v != null) S.maxListings = v; }, { min: '1', max: '5' }),
          numField('Never list below this price', () => S.minListPrice, (v) => { if (v != null) S.minListPrice = v; }, { min: '1' }),
          numField('Price when a card has no sales history', () => S.noDataPrice, (v) => { S.noDataPrice = v; }, { placeholder: 'skip these' }))))
    : kind === 'bid'
    ? h('p', { class: 'hint' }, 'Rules are checked from top to bottom and the first match wins. Leave a condition on "any"/empty to ignore it. Bids always land ~11s before the end.')
    : h('div', {},
      h('p', { class: 'hint' }, 'Recycling is permanent (about +1 balance each). Rules are checked top to bottom; first match wins. Cards in a pending trade are always kept.'),
      h('section', {}, h('label', {}, h('input', { type: 'checkbox', checked: cfg.recycle.enabled, onchange: (e) => { cfg.recycle.enabled = e.target.checked; markDirty(); } }), ' Recycling is ',

  return h('div', {}, head, list.map((_, i) => ruleCard(list, i, kind)),
    h('button', { onclick: () => { list.push(kind === 'bid' ? { name: 'new rule', when: {}, bid: { max: 5, increment: 1 } } : { name: 'new rule', when: {}, action: 'keep' }); markDirty(); draw(); } }, '+ Add rule'));
}

function renderSettings() {
  return h('div', {}, SETTINGS.map(([title, fields]) => h('section', {}, h('h2', {}, title), fields.map(([path, type, label, help, opts]) => {
    let input;
    const v = get(cfg, path);
    if (type === 'num') input = h('input', { type: 'number', value: v ?? '', oninput: (e) => { set(cfg, path, Number(e.target.value)); markDirty(); } });
    else if (type === 'bool') input = h('input', { type: 'checkbox', checked: !!v, onchange: (e) => { set(cfg, path, e.target.checked); markDirty(); } });
    else if (type === 'select') input = h('select', { onchange: (e) => { set(cfg, path, e.target.value); markDirty(); } }, opts.map((o) => h('option', { value: o, selected: v === o }, o)));
    else input = h('div', { class: 'range' }, [0, 1].map((k) => h('input', { type: 'number', value: v?.[k] ?? '', oninput: (e) => { const a = [...(get(cfg, path) ?? [0, 0])]; a[k] = Number(e.target.value); set(cfg, path, a); markDirty(); } })));
    return h('div', { class: 'row' }, h('div', {}, label, help && h('small', {}, help)), h('div', {}, input));
  }))));
}

/* ---------- cards: lifetime history of every card event ---------- */
const CARD_EVENTS = {
  pack: ['Opened in a pack', ''],
  won: ['Bought (won bid)', 'good'],
  recycled: ['Recycled', ''],
  listed: ['Listed for sale', ''],
  sold: ['Sold', 'good'],
};
const cardsFilter = { type: '', q: '' };

function renderCards() {
  const box = h('div', { id: 'cardsbox' });
  const chips = h('div', { id: 'cardchips', style: 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px' });
  const search = h('input', { type: 'text', placeholder: 'Search by card name…', value: cardsFilter.q, style: 'max-width:280px', oninput: (e) => { cardsFilter.q = e.target.value; loadCards(); } });
  box.append(
    h('p', { class: 'hint' }, 'Every card the bot has seen: opened in packs, won at auction, recycled, put on sale and sold. This is a lifetime log kept on this computer (it starts from when this feature was added). Cards the bot won by bidding, and cards that match a bid rule, are never sold or recycled.'),
    h('div', { id: 'cardsum', class: 'grid' }), chips, h('div', { style: 'margin-bottom:10px' }, search), h('div', { id: 'cardtable' }));
  return box;
}

async function loadCards() {
  window.__cardsBusy = true;
  try {
    const qs = new URLSearchParams({ limit: '500' });
    if (cardsFilter.type) qs.set('type', cardsFilter.type);
    if (cardsFilter.q) qs.set('q', cardsFilter.q);
    const r = await api('/api/cards-history?' + qs);
    if (!r.ok || tab !== 'cards' || !$('#cardtable')) return;
    const { events, counts, sums, total } = r.data;
    const tile = (label, n, sub) => h('div', { class: 'stat' }, h('b', {}, n), h('span', {}, label + (sub ? ' · ' + sub : '')));
    $('#cardsum').replaceChildren(
      tile('Opened in packs', counts.pack ?? 0), tile('Bought', counts.won ?? 0, '−' + (sums.won ?? 0)),
      tile('Recycled', counts.recycled ?? 0, '+' + (sums.recycled ?? 0)), tile('Listed for sale', counts.listed ?? 0), tile('Sold', counts.sold ?? 0, '+' + (sums.sold ?? 0)));
    $('#cardchips').replaceChildren(...[['', 'All'], ...Object.entries(CARD_EVENTS).map(([k, v]) => [k, v[0]])].map(([k, label]) =>
      h('button', { class: cardsFilter.type === k ? 'primary' : '', onclick: () => { cardsFilter.type = k; loadCards(); } }, label + (k ? ' (' + (counts[k] ?? 0) + ')' : ''))));
    const rows = events.map((e) => {
      const [label, cls] = CARD_EVENTS[e.type] ?? [e.type, ''];
      const amount = e.type === 'recycled' ? (e.gained ? '+' + e.gained : '') : e.type === 'won' ? '−' + (e.price ?? '') : e.type === 'sold' ? '+' + (e.price ?? '') : e.type === 'listed' ? (e.price ?? '') : '';
      const note = [e.wishlist ? 'on wishlist' : '', e.rule ? 'rule: ' + e.rule : '', e.average != null ? 'avg ' + e.average : ''].filter(Boolean).join(' · ');
      return h('tr', {}, h('td', {}, new Date(e.at).toLocaleString()), h('td', {}, h('span', { class: cls === 'good' ? 'good' : '' }, label)),
        h('td', {}, e.title ?? e.cardId ?? ''), h('td', {}, h('span', { class: 'chip' }, e.rarity ?? '')), h('td', {}, amount), h('td', { class: 'hint' }, note));
    });
    $('#cardtable').replaceChildren(rows.length
      ? h('table', {}, h('thead', {}, h('tr', {}, ['When', 'Event', 'Card', 'Rarity', 'Coins', 'Note'].map((x) => h('th', {}, x)))), h('tbody', {}, rows),
        ...(total > events.length ? [h('p', { class: 'hint' }, 'Showing the latest ' + events.length + ' of ' + total + ' events.')] : []))
      : h('p', { class: 'empty' }, 'Nothing here yet. Events are recorded from now on as the bot opens packs, wins auctions, recycles and sells.'));
  } finally {
    window.__cardsBusy = false;
  }
}

/* ---------- value: rough market value of owned cards ---------- */
/** Sell button: only for unprotected cards with a price; asks for a second click, then lists it. */
function sellButton(c) {
  if (c.listed) return h('span', { class: 'good' }, 'on sale');
  if (c.protectedBy || c.price == null) return '';
  const msg = h('div', { class: 'hint' });
  const btn = h('button', { onclick: async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed) {
      b.dataset.armed = '1';
      b.textContent = 'Click again to list for ' + c.price;
      setTimeout(() => { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.textContent = 'Sell for ' + c.price; } }, 4000);
      return;
    }
    b.disabled = true;
    b.textContent = 'Listing…';
    window.__valuesBusy = true;
    const r = await api('/api/sell', { method: 'POST', body: JSON.stringify({ cardId: c.cardId }) });
    window.__valuesBusy = false;
    if (r.ok) { b.replaceWith(h('span', { class: 'good' }, 'Listed for ' + r.data.price + ' (' + r.data.slotsLeft + ' slot(s) left)')); }
    else { b.disabled = false; delete b.dataset.armed; b.textContent = 'Sell for ' + c.price; msg.className = 'err'; msg.textContent = r.data.error; }
  } }, 'Sell for ' + c.price);
  return h('div', {}, btn, msg);
}

async function loadValues() {
  window.__valuesBusy = true;
  try {
    const r = await api('/api/values');
    window.__valuesAt = Date.now();
    if (!r.ok || tab !== 'value' || !$('#valuebox')) return;
    const d = r.data;
    const ago = (t) => { if (!t) return 'not yet'; const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
    const tile = (label, n, sub) => h('div', { class: 'stat' }, h('b', {}, n), h('span', {}, label + (sub ? ' · ' + sub : '')));
    const rows = d.cards.map((c) => h('tr', {},
      h('td', {}, c.title + (c.shiny ? ' ★' : '') + (c.count > 1 ? ' ×' + c.count : '')),
      h('td', {}, h('span', { class: 'chip' }, c.rarity ?? '')),
      h('td', {}, c.average != null ? h('b', {}, String(c.average)) : h('span', { class: 'hint' }, c.checkedAt ? 'no sales yet' : 'checking…')),
      h('td', {}, c.average != null ? String(Math.round(c.average * 0.75)) : ''),
      h('td', { class: 'hint' }, c.protectedBy ?? ''),
      h('td', { class: 'hint' }, ago(c.checkedAt)),
      h('td', {}, sellButton(c))));
    $('#valuebox').replaceChildren(
      h('p', { class: 'hint' }, 'A rough idea of what your cards are worth: the average price each card has sold for on the marketplace, at its rarity. The bot checks one card every few seconds at first, then refreshes slowly (each value can be up to about 12 hours old).'),
      h('div', { class: 'grid' },
        tile('Estimated collection value', Math.round(d.totalValue)),
        tile('Cards owned', d.owned),
        tile('Priced', d.priced, d.noHistory ? d.noHistory + ' with no sales yet' : ''),
        tile('Still checking', d.pending)),
      h('div', { style: 'margin-bottom:12px' }, h('button', { onclick: async (e) => { e.currentTarget.disabled = true; e.currentTarget.textContent = 'Refreshing at the normal pace (about 25 s per card)'; await api('/api/values/refresh', { method: 'POST', body: '{}' }); setTimeout(loadValues, 2000); } }, 'Refresh all prices')),
      rows.length
        ? h('table', {}, h('thead', {}, h('tr', {}, ['Card', 'Rarity', 'Average sale price', '75% (sell price)', 'Protected', 'Checked', ''].map((x) => h('th', {}, x)))), h('tbody', {}, rows))
        : h('p', { class: 'empty' }, 'Reading your collection… values appear here within a minute or two.'));
  } finally {
    window.__valuesBusy = false;
  }
}

/* ---------- connect (login) ---------- */
function renderConnect() {
  const status = h('p', { id: 'connectmsg', class: 'hint' });
  const box = h('textarea', { id: 'cookiebox', rows: '5', placeholder: 'Paste here (Ctrl+V)…', spellcheck: 'false' });
  const btn = h('button', { class: 'primary', onclick: async () => {
    status.className = 'hint'; status.textContent = 'Checking with WikiMasters…';
    btn.disabled = true;
    const r = await api('/api/cookie', { method: 'POST', body: JSON.stringify({ cookie: box.value }) });
    btn.disabled = false;
    if (r.ok) { status.className = 'hint good'; status.textContent = `Connected. Balance: ${r.data.balance}. The bot is running with this login now.`; box.value = ''; poll(); }
    else { status.className = 'hint err'; status.textContent = r.data.error ?? 'Something went wrong.'; }
  } }, 'Connect');
  const connected = state?.connected;
  return h('div', {},
    h('section', {},
      h('h2', {}, connected ? 'You are connected' : 'Connect your WikiMasters login'),
      connected
        ? h('p', { class: 'hint' }, 'The bot is logged in and renews its own session. You only need to come back here if it ever says the login was rejected.')
        : h('p', { class: 'hint err' }, state?.sessionProblem ?? 'The bot needs your login to work.')),
    h('section', {},
      h('h2', {}, connected ? 'Replace the login' : 'How to connect (about 1 minute)'),
      h('ol', { class: 'steps' },
        h('li', {}, 'Open a ', h('b', {}, 'private / Incognito window'), ' (Ctrl+Shift+N in Chrome), go to ', h('b', {}, 'wiki-masters.com/marketplace'), ' and log in. A private window gives the bot its own login, so it never clashes with your normal browser.'),
        h('li', {}, 'Press ', h('b', {}, 'F12'), ' to open DevTools and click the ', h('b', {}, 'Network'), ' tab. Then press ', h('b', {}, 'F5'), ' to reload the page.'),
        h('li', {}, 'In the list, ', h('b', {}, 'right-click the first row'), ' (named ', h('b', {}, 'marketplace'), ') and choose ', h('b', {}, 'Copy → Copy as cURL (bash)'), '.', h('br', {}), h('small', {}, 'If the list is empty, reload again with the Network tab still open. Any request to wiki-masters.com works.')),
        h('li', {}, 'Paste it in the box below (Ctrl+V) and click ', h('b', {}, 'Connect'), '. It is a long block of text, and that is fine: the bot finds your login inside it.'),
        h('li', {}, 'Close the private window. ', h('b', {}, 'Do not click "Log out"'), ' there, because that would end the bot\'s login.')),
      box, h('div', { style: 'margin-top:10px;display:flex;gap:10px;align-items:center' }, btn), status),
    h('section', {},
      h('h2', {}, 'Other ways to paste it'),
      h('p', { class: 'hint' }, 'The box also accepts just the cookie value: in DevTools → Network, click a request, open ', h('b', {}, 'Headers'), ', find ', h('b', {}, 'cookie'), ' under Request Headers and copy its value. Or a whole block of copied request headers.'),
      h('p', { class: 'hint' }, 'Why not a password? The site protects its login with a bot check, so the bot cannot sign in for you, and it will not try to get around that.'),
      h('p', { class: 'hint' }, 'The cookie is like a password for your account. It is stored only on this computer (in the .env file) and is only ever sent to wiki-masters.com.')));
}

/* ---------- shell ---------- */
const TABS = [['dashboard', 'Dashboard'], ['cards', 'Cards'], ['value', 'Value'], ['bid', 'Bid rules'], ['recycle', 'Recycle rules'], ['sell', 'Sell rules'], ['settings', 'Settings'], ['connect', 'Connect']];
function drawTabs() {
  $('#tabs').replaceChildren(...TABS.map(([id, label]) => h('button', { class: tab === id ? 'on' : '', onclick: () => { tab = id; draw(); } }, label)));
}
function draw() { drawTabs(); drawView(); }
function drawView() {
  const v = $('#view');
  if (tab === 'dashboard') { v.replaceChildren(renderDashboard()); const l = $('#log'); if (l) l.scrollTop = l.scrollHeight; }
  else if (tab === 'connect') v.replaceChildren(renderConnect());
  else if (tab === 'cards') { v.replaceChildren(renderCards()); loadCards(); }
  else if (tab === 'value') { v.replaceChildren(h('div', { id: 'valuebox' }, h('p', { class: 'empty' }, 'Loading…'))); loadValues(); }
  else if (!cfg) v.replaceChildren(h('p', { class: 'empty' }, 'Loading settings…'));
  else v.replaceChildren(tab === 'bid' ? renderRules('bid') : tab === 'recycle' ? renderRules('recycle') : tab === 'sell' ? renderRules('sell') : renderSettings());
}

async function poll() {
  const r = await api('/api/state').catch(() => null);
  if (r?.ok) {
    state = r.data;
    if (!state.connected && !window.__jumped && !state.sessionProblem?.includes('rejected')) { window.__jumped = true; tab = 'connect'; draw(); }
    const m = $('#mode');
    m.textContent = state.paused ? 'PAUSED' : state.mode === 'live' ? 'LIVE' : 'DRY-RUN';
    m.className = 'badge ' + (state.paused ? 'paused' : state.mode === 'live' ? 'live' : 'dry');
    $('#pause').textContent = state.paused ? 'Resume' : 'Pause';
    if (tab === 'cards' && !window.__cardsBusy) loadCards();
    if (tab === 'value' && !window.__valuesBusy && Date.now() - (window.__valuesAt || 0) > 15000) loadValues();
    if (tab === 'dashboard') { const l = $('#log'); const stick = !l || l.scrollTop + l.clientHeight >= l.scrollHeight - 30; drawView(); if (stick) { const n = $('#log'); if (n) n.scrollTop = n.scrollHeight; } }
  } else { $('#mode').textContent = 'offline'; $('#mode').className = 'badge paused'; }
}
let cfgVersion = null;
async function loadConfig() { const r = await api('/api/config'); cfg = r.data.config; cfgVersion = r.data.version; orig = JSON.stringify(cfg); dirty = false; $('#savebar').classList.remove('show'); draw(); }

$('#pause').onclick = async () => { await api('/api/pause', { method: 'POST', body: JSON.stringify({ paused: !state?.paused }) }); poll(); };
$('#discard').onclick = () => loadConfig();
$('#save').onclick = async () => {
  const r = await api('/api/config', { method: 'PUT', body: JSON.stringify({ version: cfgVersion, config: cfg }) });
  if (r.ok) cfgVersion = r.data.version;
  const m = $('#savemsg');
  if (r.ok) { m.textContent = 'Saved. The bot applies it within a few seconds.'; m.className = 'good'; dirty = false; setTimeout(() => $('#savebar').classList.remove('show'), 2500); }
  else { m.textContent = 'Not saved: ' + (r.data.errors ?? [r.data.error]).join('; '); m.className = 'err'; }
};
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

loadConfig();
poll();
setInterval(poll, 2000);
</script>
